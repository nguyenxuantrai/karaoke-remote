name: karaoke_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Sửa lại định dạng SDK cho chuẩn hóa với các thư viện hiện tại

dependencies:
  flutter:
    sdk: flutter

  # Các thư viện cốt lõi chạy ứng dụng Karaoke
  firebase_core: ^3.1.1
  cloud_firestore: ^5.1.0
  youtube_player_flutter: ^9.1.3
  youtube_explode_dart: ^2.2.0
  shared_preferences: ^2.2.3
  auto_start_flutter: ^1.4.0
  url_launcher: ^6.3.2
  android_intent_plus: ^5.0.2 # Thêm thư viện này để gọi SmartTube như đã bàn ở trên
  speech_to_text: ^7.3.0
  flutter_overlay_window: ^0.5.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

# CẤU HÌNH LOGO NẰM RIÊNG BIỆT - Sát lề trái là đúng
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/background.jpg